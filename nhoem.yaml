mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver: [8.8.8.8, 1.1.1.1]
  fallback:
    - https://dns.cloudflare.com/dns-query
    - tls://8.8.4.4:853
  fallback-filter:
    geoip: true
    ipcidr: [240.0.0.0/4, 0.0.0.0/32]

proxy-providers:
  aleotoidayy:
    url: dán sub
    interval: 2000
    path: ./provider/aleotoidayy.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: 🍓 Auto Select
    type: url-test
    proxies:
      - Việt Nam
      - Nhật Bản
      - Singapore
      - Đài Loan
      - HongKong
      - Nga
      - Mỹ
      - Anh
      - Ấn Độ
      - DIRECT

  - name: Việt Nam
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/vietnam.png
    use: [aleotoidayy]
    filter: "🇻🇳"
    interval: 300
    lazy: true

  - name: Nhật Bản
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/nhatban.png
    use: [aleotoidayy]
    filter: "🇯🇵"
    interval: 300
    lazy: true

  - name: Singapore
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/singapore.png
    use: [aleotoidayy]
    filter: "🇸🇬"
    interval: 300
    lazy: true

  - name: Đài Loan
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/dailoan.png
    use: [aleotoidayy]
    filter: "🇹🇼"
    interval: 300
    lazy: true

  - name: HongKong
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/hongkong.png
    use: [aleotoidayy]
    filter: "🇭🇰"
    interval: 300
    lazy: true

  - name: Nga
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/nga.png
    use: [aleotoidayy]
    filter: "🇷🇺"
    interval: 300
    lazy: true

  - name: Mỹ
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/my.png
    use: [aleotoidayy]
    filter: "🇺🇸"
    interval: 300
    lazy: true

  - name: Anh
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/anh.png
    use: [aleotoidayy]
    filter: "🇬🇧"
    interval: 300
    lazy: true

  - name: Ấn Độ
    type: select
    icon: https://raw.githubusercontent.com/aleotoidayy/nghluan/aleoo/ando.png
    use: [aleotoidayy]
    filter: "🇮🇳"
    interval: 300
    lazy: true

rules:
  - MATCH,🍓 Auto Select
